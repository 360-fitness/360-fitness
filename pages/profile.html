<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile – 360° Fitness</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="app-page">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">
        <img src="../assets/logo.png" alt="Logo" onerror="this.style.display='none'" />
        <div class="sidebar-logo-text">
          <span class="s-logo-big">360°</span>
          <span class="s-logo-small">FITNESS</span>
        </div>
      </div>
    </div>
    <ul class="nav-links">
      <li><a href="dashboard.html" class="nav-link"><span class="nav-icon">⊞</span> Dashboard</a></li>
      <li><a href="bookings.html" class="nav-link"><span class="nav-icon">📅</span> Book a Session</a></li>
      <li><a href="my-bookings.html" class="nav-link"><span class="nav-icon">🗓</span> My Bookings</a></li>
      <li><a href="profile.html" class="nav-link active"><span class="nav-icon">👤</span> Profile</a></li>
      <li><a href="membership-card.html" class="nav-link"><span class="nav-icon">🪪</span> My Card</a></li>
      <li id="adminNavItem" class="hidden"><a href="admin.html" class="nav-link admin-link"><span class="nav-icon">⚙️</span> Admin</a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebarUser"></div>
      <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
    </div>
  </nav>

  <header class="mobile-header">
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    <span class="mobile-title">Profile</span>
    <div class="mobile-avatar" id="mobileAvatar"></div>
  </header>
  <div class="sidebar-overlay hidden" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <main class="main-content">
    <div class="page-header">
      <h2 class="page-title">My Profile</h2>
    </div>

    <div class="profile-layout">
      <!-- Avatar Section -->
      <div class="section-card profile-avatar-card">
        <div class="avatar-upload-area">
          <div class="avatar-large" id="profileAvatar">?</div>
        </div>
        <div class="profile-name-display" id="profileNameDisplay">Loading...</div>
        <div class="membership-badge" id="membershipBadge">Member</div>
      </div>

      <!-- Details Section -->
      <div class="section-card profile-details-card">
        <h3>Personal Details</h3>
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="profFirstName" />
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="profLastName" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="profEmail" disabled />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="profPhone" />
        </div>
        <div class="form-group">
          <label>Membership Type</label>
          <select id="profMembership">
            <option value="monthly">Monthly</option>
            <option value="annual">Annual</option>
            <option value="day-pass">Day Pass</option>
          </select>
        </div>
        <div class="form-group">
          <label>Member Since</label>
          <input type="text" id="profSince" disabled />
        </div>
        <button class="btn-primary" onclick="saveProfile()">Save Changes</button>
        <div id="profileMsg" class="form-msg hidden"></div>
      </div>
    </div>
  </main>

  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/profile.js"></script>
</body>
</html>
