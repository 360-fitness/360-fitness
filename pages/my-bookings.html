<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings – 360° Fitness</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="app-page">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">
        <img src="../assets/logo.png" alt="Logo" onerror="this.style.display='none'" />
        <div class="sidebar-logo-text">
          <span class="s-logo-big">360°</span>
          <span class="s-logo-small">FITNESS</span>
        </div>
      </div>
    </div>
    <ul class="nav-links">
      <li><a href="dashboard.html" class="nav-link"><span class="nav-icon">⊞</span> Dashboard</a></li>
      <li><a href="bookings.html" class="nav-link"><span class="nav-icon">📅</span> Book a Session</a></li>
      <li><a href="my-bookings.html" class="nav-link active"><span class="nav-icon">🗓</span> My Bookings</a></li>
      <li><a href="profile.html" class="nav-link"><span class="nav-icon">👤</span> Profile</a></li>
      <li><a href="membership-card.html" class="nav-link"><span class="nav-icon">🪪</span> My Card</a></li>
      <li id="adminNavItem" class="hidden"><a href="admin.html" class="nav-link admin-link"><span class="nav-icon">⚙️</span> Admin</a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebarUser"></div>
      <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
    </div>
  </nav>

  <header class="mobile-header">
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    <span class="mobile-title">My Bookings</span>
    <div class="mobile-avatar" id="mobileAvatar"></div>
  </header>
  <div class="sidebar-overlay hidden" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <main class="main-content">
    <div class="page-header">
      <h2 class="page-title">My Bookings</h2>
      <p class="page-sub">Your upcoming sessions and history</p>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="filter-btn active" onclick="filterBookings('upcoming')">Upcoming</button>
      <button class="filter-btn" onclick="filterBookings('past')">Past</button>
      <button class="filter-btn" onclick="filterBookings('waitlist')">Waitlist</button>
      <button class="filter-btn" onclick="filterBookings('all')">All</button>
    </div>

    <section class="section-card">
      <div id="myBookingsList" class="booking-list">
        <div class="loading-spinner"></div>
      </div>
    </section>
  </main>

  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/my-bookings.js"></script>
</body>
</html>
