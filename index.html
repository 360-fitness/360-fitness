<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360° Fitness – Work Hard. Stay Humble.</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-brand">
      <div class="logo-circle">
        <img src="assets/logo.png" alt="360° Fitness Logo" onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'" />
        <div id="logo-fallback" class="logo-fallback" style="display:none">
          <span class="logo-text-big">360°</span>
          <span class="logo-text-small">FITNESS</span>
        </div>
      </div>
      <h1 class="brand-name">360° Fitness</h1>
      <p class="brand-tagline">Work Hard. Stay Humble.</p>
    </div>

    <!-- Tab Switcher -->
    <div class="auth-tabs">
      <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="registerTab" onclick="switchTab('register')">Join Now</button>
    </div>

    <!-- Login Form -->
    <div id="loginForm" class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="your@email.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="btn-primary" onclick="handleLogin()">Sign In</button>
      <p class="auth-link">Forgot password? <a href="#" onclick="handleForgotPassword()">Reset it</a></p>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="auth-form hidden">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="regFirstName" placeholder="John" />
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="regLastName" placeholder="Doe" />
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="your@email.com" />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="regPhone" placeholder="+27 82 000 0000" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Min 6 characters" />
      </div>
      <button class="btn-primary" onclick="handleRegister()">Create Account</button>
    </div>

    <div id="authError" class="auth-error hidden"></div>
    <div id="authLoader" class="loader hidden"></div>
  </div>

  <!-- Firebase SDK -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
